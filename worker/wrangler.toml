# Durable public Ask Sara origin after `npx wrangler deploy`:
#   https://sara-pfilates-ask.<your-subdomain>.workers.dev
# Bake that URL as VITE_SARA_API_URL for Surge. Never trycloudflare.
name = "sara-pfilates-ask"
main = "src/index.js"
compatibility_date = "2026-09-14"

[vars]
# Non-reasoning. grok-4.6 spends thousands of hidden tokens (~24–36s) per /ask.
XAI_MODEL = "grok-4.20-0309-non-reasoning"
XAI_TTS_VOICE = "ara"
SARA_AVATAR_URL = "https://sara-pfilates.surge.sh/avatar/sara-default.png"

# Public PWA origin used in minted https://…/r/{TOKEN} links.
SARA_PUBLIC_ORIGIN = "https://sara-pfilates.surge.sh"

[[kv_namespaces]]
binding = "REDEEM_TOKENS"
id = "6465ceb88c4b4fdfbc9cf0374588181d"

# Secrets — do not put keys here.
#   printf '%s' "$XAI_API_KEY" | npx wrangler secret put XAI_API_KEY
# DID_API_KEY is already set on sara-pfilates-ask. Do not commit it.
#   printf '%s' "$DID_API_KEY" | npx wrangler secret put DID_API_KEY
# After creating the Sara photo Agent, put its id (agt_...) as a Worker var/secret:
#   printf '%s' "$DID_AGENT_ID" | npx wrangler secret put DID_AGENT_ID
# Mint auth for Kajabi/Zapier. Generate with: openssl rand -hex 32
#   printf '%s' "$REDEEM_MINT_SECRET" | npx wrangler secret put REDEEM_MINT_SECRET
# Never VITE_REDEEM_MINT_SECRET. Never commit the value.
# Purchase webhook query secret (hex, so the URL keeps every character). Generate with: openssl rand -hex 32
#   printf '%s' "$KAJABI_WEBHOOK_KEY" | npx wrangler secret put KAJABI_WEBHOOK_KEY
# Comma-separated offer ids that should receive Sara. Deploy-time. Do not commit the live choice.
# Known $149 offers: 2147989270 women's, 2149556914 men's.
#   printf '%s' "$KAJABI_SARA_OFFER_IDS" | npx wrangler secret put KAJABI_SARA_OFFER_IDS
# Daily reminder Web Push. Generate with: node worker/scripts/generate-vapid.mjs
# Do not commit the values. VAPID_SUBJECT is mailto: or an https URL.
#   printf '%s' "$VAPID_PUBLIC_KEY" | npx wrangler secret put VAPID_PUBLIC_KEY
#   printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY
#   printf '%s' "$VAPID_SUBJECT" | npx wrangler secret put VAPID_SUBJECT
# Optional comma-separated do-not-contact seed. KV key ops:do-not-contact is the other seed.
#   printf '%s' "$REMINDER_SUPPRESS_EMAILS" | npx wrangler secret put REMINDER_SUPPRESS_EMAILS

[triggers]
# Every minute. A sign-up is due from its local minute through the next 14 minutes, once per local date.
crons = ["* * * * *"]
